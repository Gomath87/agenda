<title>Minha Rotina</title>
<style>
/* =====================================================
   ✏️ EDITE AQUI: CORES DO APP (variáveis logo abaixo)
   Troque o código da cor (#xxxxxx) para mudar o visual todo.
   ===================================================== */
:root{
--bg:#FAF8F6;    /* fundo da tela (creme suave) */
--card:#FFFFFF;  /* cartões */
--bd:#E8E0DC;    /* bordas delicadas */
--pri:#8B1E2B;   /* destaque e botões (bordô) */
--pri2:#A62639;  /* bordô mais claro (detalhes) */
--ok:#3D7A57;    /* concluído / pago (verde sálvia) */
--warn:#7A5C6B;  /* "vence hoje" (malva) */

--tx2:#635B5D}   /* texto secundário (cinza escuro) */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#app{padding:12px 16px calc(160px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
h1{font-size:30px;margin:8px 0 2px}h2{margin:0;font-size:22px}
h3{margin:22px 0 8px;font-size:15px;color:var(--tx2);text-transform:uppercase;letter-spacing:.04em}
h3.late{color:var(--pri)}h3.warn{color:var(--warn)}h3.okt{color:var(--ok)}
.sub,small{color:var(--tx2);font-size:15px}p.sub{margin:0 0 12px}
/* ---- Cartões, botões, campos ---- */
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:14px;margin-bottom:12px}
.vazio{text-align:center;color:var(--tx2);padding:28px 14px}
.btn{display:block;width:100%;min-height:54px;margin:10px 0 0;border:0;border-radius:16px;font:inherit;font-weight:600;color:#fff;background:var(--pri)}
.btn:active{transform:scale(.98)}
.ghost{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 2px var(--pri)}
.okb{background:var(--ok)}
.btn.sm{width:auto;min-width:92px;margin:0;min-height:48px;padding:0 14px}
.lnk{background:none;border:0;color:var(--tx2);font:inherit;font-size:15px;text-decoration:underline;padding:12px 0 0}
.in{display:block;width:100%;min-height:50px;padding:10px 14px;border:1.5px solid var(--bd);border-radius:14px;background:#fff;font:inherit;color:var(--tx);text-align:left}
label{display:block;margin:14px 0 6px;font-weight:600;font-size:15px}
.r2{display:flex;gap:10px}.r2>*{flex:1;min-width:0}.mb{margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}.grow{flex:1;min-width:0}
.tag{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600}
.tag.n{background:#EFE8E4;color:var(--tx2)}
.hr{font-size:22px;font-weight:700;color:var(--pri);min-width:64px}
.aula.done{background:#F1F6F2;border-color:#BFD5C5;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.02)}}
.nt{margin-top:10px}
/* ---- Saudação de bom dia (topo da agenda) ---- */
.gm{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;font-size:18px;font-weight:600;line-height:1.35}
/* ---- Selo "Adiantado" ---- */
.selo{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#F3E6E8;color:var(--pri)}
/* ---- Botões Faltou / Adiantar e botão Encerrar dia ---- */
.acoes{display:flex;gap:10px;margin-top:10px}.acoes .btn{margin:0;min-height:48px;flex:1}
.fim{background:var(--tx);margin-top:18px}
/* ---- Agenda por horário: horários Vago, faltas e botões de hora ---- */
.vago{display:flex;align-items:center;gap:12px;min-height:60px;margin-bottom:10px;padding:8px 14px;border:1.5px dashed var(--bd);border-radius:18px;color:var(--tx2)}
.vago .hr{color:var(--tx2);font-size:20px;min-width:64px}.vago b{font-weight:600}.vago.pass{opacity:.45;pointer-events:none}
.mais{width:44px;height:44px;border-radius:99px;background:#fff;border:1.5px solid var(--bd);color:var(--pri);font-size:26px;display:flex;align-items:center;justify-content:center;line-height:1}
.falt{display:flex;align-items:center;justify-content:space-between;margin:0 4px 8px;padding:4px 12px;font-size:15px;color:var(--tx2);background:#F3E6E8;border-radius:12px}
.falt .lnk{padding:8px 0 8px 10px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:50px;min-width:68px;padding:0 14px;border-radius:14px;border:1.5px solid var(--pri);background:#fff;color:var(--pri);font:inherit;font-weight:700;font-size:17px}
.chip.sm{min-height:44px;min-width:58px;font-size:16px}
.tag.av{background:#F3E6E8;color:var(--pri)}
/* ---- Janela de confirmação/aviso ---- */
#cf{display:none;position:fixed;inset:0;background:rgba(34,30,31,.5);z-index:30;align-items:center;justify-content:center;padding:24px}
.dlg{background:var(--bg);border-radius:22px;padding:22px;width:100%;max-width:360px}.dlg p{font-size:18px;font-weight:600;margin:0 0 6px;text-align:center}
/* ---- Visual premium: sombras sutis, painel, progresso, semana, gráficos, menu ---- */
.card{box-shadow:0 1px 2px rgba(34,30,31,.05)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dash{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 12px}
.dash .card{margin:0;padding:12px}.dash small{display:block}.dash b{font-size:22px}.dash .wide{grid-column:1/-1}
.bar{height:8px;border-radius:99px;background:#EFE8E4;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.prox{border-color:var(--pri);box-shadow:0 0 0 3px #8B1E2B1A}
.dia{display:flex;align-items:center;gap:12px}.dia .n{min-width:52px;text-align:center}.dia .n b{font-size:22px;display:block}
.hbar{display:flex;align-items:center;gap:8px;margin:8px 0;font-size:15px}
.hbar span{min-width:84px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx2)}
.hbar .bar{flex:1;margin:0}.hbar .bar i{background:var(--pri)}.hbar em{font-style:normal;font-weight:700;min-width:64px;text-align:right}
.menu{display:flex;align-items:center;justify-content:space-between;text-align:left;font:inherit;width:100%;min-height:62px;color:var(--tx)}
.back{border:0;background:none;color:var(--pri);font:inherit;font-weight:600;padding:8px 0;min-height:44px}
/* ---- Evolução visual: alerta terracota, ícones, transições, movimento reduzido ---- */
:root{--terra:#B5654A}
h1{letter-spacing:-.02em}.dash b,.amt,.hr{font-variant-numeric:tabular-nums}
.btn{min-height:50px;border-radius:14px}
h3.late,h3.warn{color:var(--terra)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;vertical-align:-4px;flex:none}
.noite .em .ic{width:44px;height:44px;color:var(--pri)}.gm .ic{vertical-align:-5px;margin-right:4px}
.vw.go{animation:fi .24s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
#ov{animation:ovin .2s ease}.sheet.in{animation:up .26s cubic-bezier(.2,.8,.2,1)}.sheet.out{animation:dn .17s ease forwards}
@keyframes ovin{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}@keyframes dn{to{transform:translateY(40px);opacity:0}}
.btn,.chip,.menu,.dia,.vago{transition:transform .12s,background .15s,opacity .15s}.dia:active,.vago:active,.menu:active{transform:scale(.985)}
.cft{color:var(--terra);font-weight:600;font-size:15px;margin-top:8px}
.mini{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--bd)}.mini:first-child{border-top:0}.mini .hr{font-size:18px;min-width:56px}
#tt{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--tx);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:.25s;z-index:40;white-space:nowrap}
#tt.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- Selo, alertas e abas de 3 botões ---- */
nav button{position:relative}
.bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:99px;background:var(--terra);color:#fff;font-size:11px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px}
.pill{min-width:26px;height:26px;border-radius:99px;background:var(--terra);color:#fff;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;padding:0 8px}
.seg.s3 button{font-size:13px;line-height:1.15;padding:0 2px}
/* ---- Sensação de app nativo: sem seleção de texto nem menu de toque longo (exceto nos campos de formulário) ---- */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
/* ---- Dupla (2 alunos no mesmo horário), botões de dia e barra inferior fixa ---- */
.dupla{border-left:3px solid var(--pri);padding-left:10px;margin-bottom:12px}.dupla .card{margin-bottom:8px}
.dl{font-size:13px;font-weight:700;color:var(--pri);margin:0 0 6px;text-transform:uppercase;letter-spacing:.04em}
.chip.on{background:var(--pri);color:#fff}
nav{position:fixed;left:0;right:0;bottom:0;transform:translateZ(0);-webkit-transform:translateZ(0)} /* barra inferior sempre fixa na tela */
/* ---- Cartão de Boa noite ---- */
.noite{text-align:center}.noite .em{font-size:44px}.noite p{font-size:19px;font-weight:600;margin:10px 0}
.amanha{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:12px;margin:14px 0;text-align:left}
.wk{display:flex;align-items:center;gap:4px;margin:8px 0 6px}.days{flex:1;display:flex;gap:4px}
.dy{flex:1;border:1px solid var(--bd);background:#fff;border-radius:14px;min-height:60px;font:inherit;color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0}
.dy small{font-size:12px}.dy b{font-size:18px}.dy.td b{color:var(--pri)}
.dy.on{background:var(--pri);border-color:var(--pri)}.dy.on small,.dy.on b{color:#fff}
.ar{border:0;background:none;font-size:30px;color:var(--pri);width:30px;min-height:56px;padding:0}
/* ---- Barra de baixo, botão + e janelas ---- */
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;font:inherit;font-size:12px;font-weight:600;color:var(--tx2);min-height:54px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:22px}nav button.on{color:var(--pri)}
#fab{position:fixed;right:16px;bottom:calc(82px + env(safe-area-inset-bottom));z-index:6;border:0;border-radius:99px;min-height:58px;padding:0 24px;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:18px;box-shadow:0 6px 18px rgba(139,30,43,.35)}
#ov{display:none;position:fixed;inset:0;background:rgba(45,41,38,.45);z-index:10}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:18px 16px calc(28px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
.sh{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:#EFE8E4;border-radius:99px;width:40px;height:40px;font-size:16px;color:var(--tx2)}
.fx,.av{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:8px 8px 8px 14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap}
.av .sub{flex-basis:100%}
.seg{display:flex;background:#EFE8E4;border-radius:14px;padding:4px;margin-top:14px}
.seg button{flex:1;border:0;background:none;border-radius:11px;min-height:46px;font:inherit;font-weight:600;color:var(--tx2)}
.seg .on{background:#fff;color:var(--pri)}
.big{text-align:center;margin:0}.big small{display:block}.big b{font-size:24px}.big.g b{color:var(--ok)}.big.p b{color:var(--pri)}
.pay{display:flex;align-items:center;gap:10px}.pay.paid{opacity:.75}.amt{font-weight:700;white-space:nowrap}
</style></head><body>
<!-- Área onde as telas (Hoje, Alunos, Dinheiro, Backup) são desenhadas pelo JavaScript -->
<div id="app"></div>
<button id="fab" onclick="tab=='alunos'?sheetAluno():(tab=='hoje'&&(sel=hoje()),sheetAdd())"></button>
<!-- Barra de baixo: para mudar nomes/ícones das abas, edite os botões abaixo -->
<nav>
<button data-t="hoje" onclick="go('hoje')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Hoje</button>
<button data-t="agenda" onclick="go('agenda')"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Agenda</button>
<button data-t="alunos" onclick="go('alunos')"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5c2.2.7 3.5 2.7 3.5 5.5"/></svg>Alunos</button>
<button data-t="grana" onclick="go('grana')"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg>Financeiro<span class="bdg" id="bd"></span></button>
<button data-t="mais" onclick="go('mais')"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Mais</button>
</nav>
<!-- Janela que sobe de baixo (cadastro, adiantar aula, boa noite) -->
<div id="ov"></div>
<!-- Janela de confirmação/aviso do próprio app (no lugar de confirm/alert do navegador) -->
<div id="tt"></div>
<div id="cf"></div>
<script>
/* =====================================================
   Todo o app fica neste bloco. Procure os avisos "✏️ EDITE AQUI":
   frases de bom dia, frases de boa noite, cores das etiquetas e regras da agenda.
   ===================================================== */
const $=s=>document.querySelector(s),K='rotina_personal_v1';
const DIAS=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],DC=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const MES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
/* ✏️ EDITE AQUI: cores das etiquetas de academia (cada academia pega uma cor desta lista) */
const COR=['#8B1E2B','#3D7A57','#6A5A8C','#2F6F7E','#A04A6E','#5C6B3A'];
/* Dados do app: alunos, aulas avulsas, aulas feitas, faltas, adiantamentos e pagamentos */
const base=()=>({cfg:{nome:'',hIni:5,hFim:21,frase:true,vagos:true},alunos:[],aulas:[],feitas:{},faltas:{},mov:{},pagos:{},recebidos:[],despFixas:[],despPagas:{},despLanc:[]});
/* Se os dados salvos estiverem ilegíveis, uma cópia é guardada em K_corrompido antes de começar do zero. */
function load(){const raw=localStorage.getItem(K);try{return{...base(),...JSON.parse(raw)}}catch(e){try{localStorage.setItem(K+'_corrompido',raw)}catch(_){}return base()}}
let D=load(),tab='hoje',q='',E,AT='avulsa';
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){aviso('Não consegui salvar. Faça um backup e libere espaço no iPhone.')}}
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const hoje=()=>iso(new Date()),ad=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
let sel=hoje();
const brl=v=>(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};
const fd=s=>s.split('-').reverse().join('/'),fd2=s=>fd(s).slice(0,5),cap=s=>s[0].toUpperCase()+s.slice(1);
function tag(ac){if(!ac)return'';let h=0;for(const c of ac.toLowerCase())h=(h*31+c.charCodeAt(0))%97;const c=COR[h%COR.length];return`<span class="tag" style="background:${c}22;color:${c}">${esc(ac)}</span>`}
function dlAc(){const L=[...new Set([...D.alunos.map(a=>a.academia),...D.aulas.map(a=>a.academia)].filter(Boolean))];return`<datalist id="dl-a">${L.map(a=>`<option value="${esc(a)}">`).join('')}</datalist>`}
function sheet(h){FK++;const o=$('#ov'),p=o.querySelector('.sheet'),sc=p?p.scrollTop:0,nv=o.style.display!='block';o.innerHTML='<div class="sheet'+(nv?' in':'')+'">'+h+'</div>';o.style.display='block';o.querySelector('.sheet').scrollTop=sc}
/* ✏️ CONFIRMAÇÃO E AVISO do próprio app. ask(texto, o que fazer ao confirmar, texto do botão); aviso(texto). */
function ask(msg,fn,ok){const o=$('#cf');o.innerHTML=`<div class="dlg"><p>${esc(msg)}</p><button class="btn" id="cf-ok">${ok||'Sim'}</button><button class="btn ghost" id="cf-no">Cancelar</button></div>`;o.style.display='flex';
$('#cf-no').onclick=()=>{o.style.display='none'};$('#cf-ok').onclick=()=>{o.style.display='none';fn()}}
function aviso(msg){const o=$('#cf');o.innerHTML=`<div class="dlg"><p>${esc(msg)}</p><button class="btn" id="cf-ok">OK</button></div>`;o.style.display='flex';$('#cf-ok').onclick=()=>{o.style.display='none'}}
function fechar(){const o=$('#ov'),p=o.querySelector('.sheet'),my=++FK;if(!p){o.style.display='none';return}p.classList.add('out');setTimeout(()=>{if(my==FK){o.style.display='none';o.innerHTML=''}},170)}
function go(t){tab=t;q='';MS='menu';GO=true;FM=0;render();scrollTo(0,0)}
function render(){D.cfg={...base().cfg,...D.cfg};D.despFixas=D.despFixas||[];D.despPagas=D.despPagas||{};D.despLanc=D.despLanc||[];D.recebidos=D.recebidos||[];H_INI=+D.cfg.hIni||5;H_FIM=+D.cfg.hFim||21; /* horário vem das Configurações */
document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==tab));
const f=$('#fab');f.style.display=(tab=='hoje'||tab=='agenda'||tab=='alunos')?'block':'none';f.textContent=tab=='alunos'?'+ Aluno':'+ Aula';const nb=cobr().n+alertDesp().length,bd=$('#bd');bd.textContent=nb;bd.style.display=nb?'flex':'none'; /* selo no Financeiro */
const v=({hoje:vHoje,agenda:vAgenda,alunos:vAlunos,grana:vGrana,mais:vMais})[tab]();$('#app').innerHTML='<div class="vw'+(GO?' go':'')+'">'+v+'</div>';GO=false;if(tab=='alunos')lista()}

/* =====================================================
   ✏️ EDITE AQUI: FRASES DE BOM DIA (aparecem no topo da agenda de hoje)
   - Uma frase por dia do mês: dia 1 usa a 1ª frase, dia 2 a 2ª ... dia 31 a 31ª.
   - Para TROCAR: mude o texto entre aspas.
   - Para ADICIONAR: ponha uma vírgula no fim da última linha e escreva a nova frase entre aspas.
   - Para REMOVER: apague a linha inteira. (Com menos de 31 frases, elas repetem dentro do mesmo mês.)
   - Não use aspas duplas (") dentro da frase e mantenha vírgula no fim de cada linha, menos na última.
   ===================================================== */
const BOM_DIA=[
"Gata! Vamos com tudo hoje!",
"Miau! 🐱 Hoje o dia já começou com energia boa?",
"Cadê a mulher mais linda desse mundo todinho?",
"Au-au! Já acordei, já vigiei a casa e agora tô liberando você pra ir treinar.🐶",
"Hoje você vai fazer a diferença na vida de muita gente!",
"Levanta que o mundo precisa dessa energia!",
"Vamos trabalhar mamãe? Comprar a ração de Mildo Mildo 🐶",
"Esse sorriso abre qualquer academia. Bom dia! 😊",
"Hoje tem aluno evoluindo por sua causa, vamos com tudo!",
"Café na mão e foco no coração.",

/* No ÚLTIMO dia real do mês (28, 29, 30 ou 31, calculado pelo calendário) usa sempre a última frase da lista. */
const frase=(L,data)=>{const[a,m,d]=data.split('-').map(Number),ult=new Date(a,m,0).getDate();return L[d==ult?L.length-1:(d-1)%L.length]};

/* =====================================================
   ✏️ REGRAS DA AGENDA (horários, vagas, faltas, adiantar, avaliação, encerrar dia)
   ✏️ HORÁRIO DE ATENDIMENTO: mude H_INI (primeira hora) e H_FIM (última hora) logo abaixo.
   Dados guardados em D (tudo só neste aparelho):
   - chave da aula: fixa = idAluno|data|horaOriginal ; avulsa/avaliação = a|idDaAula
   - D.aulas[]  = aulas avulsas e avaliações: {id,nome,data,hora,academia,valor,tipo}  (tipo 'aval' = avaliação física)
   - D.faltas[chave] = {nome,data,hora,aid}  aluno faltou: fica no histórico dele e
       NÃO mexe no faturamento (mensalidades e valores avulsos continuam valendo).
   - D.mov[chave] = {de,para}  aula adiantada (de = horário original, para = novo horário)
   - VAGO = hora inteira (de H_INI a H_FIM) sem nenhuma aula ativa. É calculado na hora:
       quando alguém falta ou é adiantado, o horário antigo aparece sozinho como "Vago".
   ===================================================== */
let H_INI=5,H_FIM=21; /* valores reais vêm de Mais › Configurações */
const p2=n=>String(n).padStart(2,'0'),hora2=h=>p2(h)+':00',hh=h=>{const[a,b]=h.split(':');return +a+'h'+(b=='00'?'':b)}; /* 16:00 -> 16h */
/* Todas as aulas de um dia (inclui as que faltaram), com adiantamentos aplicados. */
function aulasDia0(d){const w=pd(d).getDay(),L=[];
D.alunos.forEach(a=>(a.fixos||[]).forEach(f=>{if(f.dia==w&&!(D.mov[a.id+'|'+d+'|'+f.hora]||{}).data)L.push({k:a.id+'|'+d+'|'+f.hora,nome:a.nome,hora:f.hora,ac:a.academia,fixa:1,aid:a.id})}));
D.aulas.filter(x=>x.data==d).forEach(x=>L.push({k:'a|'+x.id,nome:x.nome,hora:x.hora,ac:x.academia,fixa:0,id:x.id,aval:x.tipo=='aval',valor:x.valor,paga:x.paga}));
Object.keys(D.mov).forEach(k=>{const m=D.mov[k];if(m.data!=d||k.startsWith('a|'))return;const[id,od]=k.split('|'),a=D.alunos.find(x=>x.id==id);if(a)L.push({k,nome:a.nome,hora:m.para,ac:a.academia,fixa:1,aid:a.id,deData:od})}); /* aulas fixas reagendadas PARA este dia */
return L.map(l=>{const m=D.mov[l.k];if(m){l.de=m.de;l.hora=m.para}l.falta=!!D.faltas[l.k];return l}).sort((a,b)=>a.hora.localeCompare(b.hora))}
/* Horas inteiras livres (sem aula ativa) de um dia. */
function livres(d){const oc=new Set(aulasDia(d).filter(l=>!l.falta).map(l=>parseInt(l.hora)));const V=[];for(let h=H_INI;h<=H_FIM;h++)if(!oc.has(h))V.push(h);return V}
/* Linha do tempo do dia: cada hora de H_INI a H_FIM (+ horas fora desse intervalo que tenham aula). */
function slots(d){const L=aulasDia(d),H=new Set();for(let h=H_INI;h<=H_FIM;h++)H.add(h);L.forEach(l=>H.add(parseInt(l.hora)));
return[...H].sort((a,b)=>a-b).map(h=>({h,L:L.filter(l=>parseInt(l.hora)==h)}))}
/* Seletor de hora inteira (mais fácil que a roda do relógio). */
function hrSel(id,val){let o='';for(let h=H_INI;h<=H_FIM;h++)o+=`<option value="${hora2(h)}"${hora2(h)==val?' selected':''}>${h}h</option>`;
if(val&&!o.includes(`value="${val}"`))o=`<option value="${val}" selected>${hh(val)}</option>`+o;return`<select class="in" id="${id}"${id=='a-h'?' onchange="liv()"':''}>${o}</select>`}

pend=A.filter(l=>D.feitas[l.k]===undefined),ats=pend.filter(l=>parseInt(l.hora)==h),fut=pend.filter(l=>parseInt(l.hora)>h),nxh=fut.length?parseInt(fut[0].hora):-1,nxs=fut.filter(l=>parseInt(l.hora)==nxh),mais=fut.filter(l=>parseInt(l.hora)>nxh),at=ats[0],nx=nxs[0],

return`<div class="card" onclick="sheetAluno('${a.id}')"><b>${esc(a.nome)}</b> ${tag(a.academia)}<div class="sub">${fx||'Sem horário fixo'}</div><div class="sub">${a.tipo=='avulso'?'Avulsa · '+brl(a.valor)+' por aula':a.valor?brl(a.valor)+' · vence dia '+a.venc:'Sem valor definido'}</div></div>`}).join(''):`<div class="card vazio">${D.alunos.length?'Ninguém encontrado.':'Nenhum aluno ainda.<br>Toque em <b>+ Aluno</b> para começar.'}</div>`}
function sheetAluno(id){XD=new Set();XH='08:00';E=id?JSON.parse(JSON.stringify(D.alunos.find(a=>a.id==id))):{id:uid(),nome:'',academia:'',fixos:[],tipo:'mensal',valor:'',venc:5,aval:[]};E.fixos=E.fixos||[];E.aval=E.aval||[];drawAluno()}
function drawAluno(){const ex=D.alunos.some(a=>a.id==E.id);
sheet(`<div class="sh"><h2>${ex?'Aluno':'Novo aluno'}</h2><button class="x" onclick="fechar()">✕</button></div>

<label>Dias e horários fixos</label>
${E.fixos.map((f,i)=>`<div class="fx"><span>${DIAS[f.dia]} às ${f.hora}</span><button class="x" onclick="rmFx(${i})">✕</button></div>`).join('')}
<div class="chips" style="margin:2px 0 10px">${DC.map((d,i)=>`<button class="chip sm${XD.has(i)?' on':''}" onclick="togDia(${i})">${d}</button>`).join('')}</div>
${hrSel('x-h',XH)}

<select class="in" id="f-t" onchange="collect();drawAluno()"><option value="mensal"${E.tipo=='mensal'?' selected':''}>Mensalidade (vence todo mês)</option><option value="avulso"${E.tipo=='avulso'?' selected':''}>Aula avulsa (paga por aula)</option></select>
<div class="r2"><div><label>${E.tipo=='avulso'?'Valor por aula (R$)':'Valor (R$)'}</label><input class="in" id="f-v" type="number" inputmode="decimal" value="${E.valor}" placeholder="0"></div>
${E.tipo=='mensal'?`<div><label>Vence no dia</label><input class="in" id="f-vc" type="number" inputmode="numeric" min="1" max="31" value="${E.venc}"></div>`:''}</div>
<h3>Observações</h3><textarea class="in" id="f-o" rows="3" placeholder="Preferências de horário, combinados, informações importantes">${esc(E.obs||'')}</textarea>
<h3>Histórico</h3>${hist(E.id)}
<h3>Faltas</h3>${Object.values(D.faltas).filter(f=>f.aid?f.aid==E.id:f.nome.toLowerCase()==E.nome.trim().toLowerCase()).sort((a,b)=>b.data.localeCompare(a.data)).map(f=>`<div class="sub">${fd(f.data)} às ${f.hora}</div>`).join('')||'<p class="sub">Nenhuma falta registrada.</p>'}
<button class="btn" onclick="svAluno()">Salvar aluno</button>
${ex?'<button class="lnk" onclick="delAluno()">Excluir aluno</button>':''}`)}
function collect(){const g=i=>{const e=$('#'+i);return e?e.value:null};
E.nome=g('f-n')??E.nome;E.academia=(g('f-a')??E.academia).trim();E.tipo=g('f-t')??E.tipo;E.valor=g('f-v')??E.valor;E.venc=g('f-vc')??E.venc;E.obs=g('f-o')??E.obs}
function rmFx(i){collect();E.fixos.splice(i,1);drawAluno()}
function commit(){collect();E.nome=E.nome.trim();if(!E.nome){aviso('Escreva o nome do aluno primeiro.');return false}
if(!E.criado)E.criado=hoje();E.valor=num(E.valor);E.venc=Math.min(31,Math.max(1,parseInt(E.venc)||5));
const c=JSON.parse(JSON.stringify(E)),i=D.alunos.findIndex(a=>a.id==E.id);i<0?D.alunos.push(c):D.alunos[i]=c;save();return true}
function svAluno(){if(commit()){fechar();render()}}
function delAluno(){ask('Excluir este aluno e o histórico dele?',()=>{D.alunos=D.alunos.filter(a=>a.id!=E.id);save();fechar();render()},'Excluir')}

/* ---------- DINHEIRO ----------
   Duas abas dentro de Faturamento:
   - Mensalidades: alunos com valor mensal e dia de vencimento (mês atual). Faltas NÃO alteram nada aqui.
   - Avulsa/Avaliação: aulas avulsas e avaliações JÁ FEITAS e ainda NÃO pagas (de qualquer dia).
     Ficam na lista, dia após dia, até você tocar em "Pago". Aí o valor entra em "Já ganhou"
     (D.recebidos, só valor e data, SEM nome) e o nome da pessoa é apagado. */
let FT='mens';
function itens(ym){ym=ym||hoje().slice(0,7);const I=[],ult=new Date(+ym.slice(0,4),+ym.slice(5),0).getDate();
D.alunos.forEach(a=>{if(a.tipo!='avulso'&&a.valor>0)I.push({k:'m|'+a.id+'|'+ym,nome:a.nome,v:a.valor,due:ym+'-'+String(Math.min(a.venc||5,ult)).padStart(2,'0'),txt:'Mensalidade'})});return I}
/* Avulsas/avaliações feitas, com valor e ainda sem pagar (mais antigas primeiro). */
function pendAv(){return D.aulas.filter(x=>!x.paga&&x.valor>0&&D.feitas['a|'+x.id]!==undefined).sort((a,b)=>a.data.localeCompare(b.data)||a.hora.localeCompare(b.hora))}
function row(i){return`<div class="card pay${i.p?' paid':''}"><div class="grow"><b>${esc(i.nome)}</b><div class="sub">${i.txt} · ${i.p?'pago ✓':'vence '+fd2(i.due)+' · '+quando(diasPara(i.due))}</div></div><div class="amt">${brl(i.v)}</div><button class="btn sm ${i.p?'ghost':'okb'}" onclick="pagar('${i.k}')">${i.p?'Desfazer':'Pago'}</button></div>`}
function pagar(k){if(D.pagos[k])delete D.pagos[k];else{const a=D.alunos.find(x=>x.id==k.split('|')[1]);D.pagos[k]=a&&a.valor>0?a.valor:true;toast('Pagamento registrado')} /* guarda o valor pago: mudar o preço depois não altera o histórico */save();render()}
function rowAv(x){return`<div class="card pay"><div class="grow"><b>${esc(x.nome)||'Sem nome'}</b><div class="sub">${x.tipo=='aval'?'Avaliação física':'Aula avulsa'} · feita em ${fd2(x.data)}</div></div><div class="amt">${brl(x.valor)}</div><button class="btn sm okb" onclick="pagarAv('${x.id}')">Pago</button></div>`}
/* PAGO (avulsa/avaliação): guarda só o valor e apaga o nome da pessoa. */
function pagarAv(id){const x=D.aulas.find(a=>a.id==id);if(!x)return;
ask('Marcar '+brl(x.valor)+' como pago? O valor entra no histórico com nome e data.',()=>{
D.recebidos.push({id:uid(),nome:x.nome,valor:x.valor,data:hoje(),tipo:x.tipo=='aval'?'aval':'avulsa'});
const k='a|'+id;x.valor=0;x.paga=true;if(D.feitas[k])D.feitas[k]={nota:''};save();render()},'Marcar como pago')}
/* LIMPEZA AUTOMÁTICA (privacidade), roda ao abrir o app e ao virar o dia:
   avulsas/avaliações de dias passados que já estão resolvidas (feitas sem valor, pagas, ou que faltaram)
   são apagadas junto com o nome. Só ficam guardadas as que ainda faltam pagar. */
function limpa(){const t=hoje();D.recebidos=D.recebidos||[];D.despFixas=D.despFixas||[];D.despPagas=D.despPagas||{};D.despLanc=D.despLanc||[];D.alunos.forEach(a=>{if(!a.criado)a.criado=hoje().slice(0,8)+'01'});
D.aulas.forEach(x=>{const k='a|'+x.id;if(D.pagos[k]){if(x.valor>0){D.recebidos.push({id:uid(),nome:x.nome,valor:x.valor,data:x.data,tipo:x.tipo=='aval'?'aval':'avulsa'});x.valor=0;x.paga=true}delete D.pagos[k]}}); /* converte pagamentos do modelo antigo */
D.aulas=D.aulas.filter(x=>{const k='a|'+x.id,f=D.faltas[k],ok=D.feitas[k]!==undefined,fim=x.data<t&&((ok&&!(x.valor>0))||(f&&!f.aid));
if(fim){delete D.feitas[k];delete D.mov[k];delete D.faltas[k]}return!fim});save()}

function vBk(){return`<h1>Backup</h1><div style="height:8px"></div><div class="card">${ico('lock')} Seus dados ficam guardados <b>só neste iPhone</b>. Nada vai para a internet.<br><br>Salve um backup de vez em quando. Ao tocar no botão, escolha <b>Salvar em Arquivos</b>.<br><br>Último backup: <b>${ultimoTxt()}</b></div>
<button class="btn" onclick="salvar()">Salvar backup</button>

async function salvar(){const nome='backup-rotina-'+hoje()+'.json',b=new Blob([JSON.stringify({app:'rotina-personal',v:1,dados:D})],{type:'application/json'}),f=new File([b],nome,{type:'application/json'});
try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});marcaBackup();return}}catch(e){if(e.name=='AbortError')return}
const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=nome;document.body.appendChild(a);a.click();a.remove();marcaBackup();setTimeout(()=>URL.revokeObjectURL(u),5000)}
function restaurar(i){const f=i.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{let d;try{const j=JSON.parse(r.result);d=j.dados||j;if(!Array.isArray(d.alunos)||d.alunos.some(a=>!a||!a.id||!a.nome))throw 0;sanea(d)}catch(e){aviso('Esse arquivo não parece ser um backup deste app.');i.value='';return}
ask('Isso troca tudo que está no app pelos dados do backup. Continuar?',()=>{try{localStorage.setItem(K+'_antes_restaurar',JSON.stringify(D))}catch(_){}D={...base(),...d};limpa();render();aviso('Backup restaurado ✓')},'Restaurar');i.value=''};r.readAsText(f)}

/* =====================================================
   NOVAS TELAS: Painel do dia, Agenda semanal, Mais (Relatórios, Configurações, Backup)
   ===================================================== */
let MS='menu',PROX=null,RP='mes',AF='todos'; /* MS = subtela de "Mais"; RP = período do relatório; AF = filtro de alunos */
/* ✏️ SAUDAÇÃO DO TOPO DA TELA INICIAL, por horário: 04:00–11:59 Bom dia (sol + frase do dia) · 12:00–17:59 Boa tarde (só sol) · 18:00–23:59 Boa noite (só lua) · 00:00–03:59 Boa noite (coruja + frase) */
const saud=()=>{const h=new Date().getHours();return(h>=4&&h<12?'Bom dia':h>=12&&h<18?'Boa tarde':'Boa noite')+(D.cfg.nome?', '+esc(D.cfg.nome):'')};
function subTopo(h,t){const mk=x=>`<p class="sub" style="margin:6px 0 14px">${x}</p>`;
if(h>=4&&h<12)return mk(ico('sun')+' '+esc(frase(BOM_DIA,t))); /* manhã: sol + frase do dia */
if(h>=12&&h<18)return mk(ico('sun')); /* tarde: só o sol */
if(h>=18)return mk(ico('moon')); /* noite: só a lua (as frases de BOA_NOITE aparecem no botão Encerrar dia) */
return mk(ico('owl')+' Você já deveria estar dormindo né corujinha?')} /* madrugada */
/* Painel de resumo do dia (cartões + barra de progresso) */

<div class="card wide"><small>Progresso do dia · ${pc}%</small><div class="bar"><i style="width:${pc}%"></i></div></div></div>`}

const rows=[0,1,2,3,4,5,6].map(i=>{const k=ad(s0,i),A=aulasDia(k).filter(l=>!l.falta),lv=livres(k).length,pc=Math.round((nh-lv)/nh*100);tot+=A.length;

/* ---------- CONFIGURAÇÕES (nome, horário de atendimento, preferências, armazenamento) ---------- */
function vCfg(){const c=D.cfg,kb=Math.max(1,Math.round(JSON.stringify(D).length/1024));
const opt=(a,b,v)=>{let o='';for(let h=a;h<=b;h++)o+=`<option value="${h}"${h==v?' selected':''}>${h}h</option>`;return o};

/* ---------- RELATÓRIOS (tudo calculado dos dados reais; nada inventado) ---------- */
function rango(){const t=hoje(),ym=t.slice(0,7);if(RP=='mes')return[ym+'-01',ym+'-31'];
if(RP=='ant'){const d=pd(ym+'-01');d.setMonth(d.getMonth()-1);const m=iso(d).slice(0,7);return[m+'-01',m+'-31']}
if(RP=='90')return[ad(t,-90),t];return['0000-00-00','9999-99-99']}
/* Recebido num mês: mensalidades marcadas como pagas (valor atual do aluno) + avulsas/avaliações pagas. */
function recMes(ym){let m=0;Object.keys(D.pagos).forEach(k=>{const p=k.split('|');if(p[0]=='m'&&p[2]==ym){const x=D.pagos[k],a=D.alunos.find(y=>y.id==p[1]);if(typeof x=='number')m+=x;else if(a)m+=a.valor||0}});
const v=D.recebidos.filter(r=>r.data.slice(0,7)==ym).reduce((s,r)=>s+r.valor,0);return{m,v,t:m+v}}
function vRel(){const[a,b]=rango(),inr=d=>d>=a&&d<=b,nm=id=>(D.alunos.find(x=>x.id==id)||{}).nome,F=[];
Object.keys(D.feitas).forEach(k=>{const p=k.split('|');if(p.length==3&&inr(p[1]))F.push({aid:p[0],hora:p[2]})});

const R=D.recebidos.filter(r=>inr(r.data)),fal=Object.values(D.faltas).filter(f=>inr(f.data)),pa={},hc={};

/* ---------- DESPESAS (fixas, variáveis e outros) ----------

   ===================================================== */
/* ✏️ LEMBRETE DE BACKUP: BK_DIAS = de quantos em quantos dias o app lembra de salvar os dados.
   A data do último backup fica no localStorage (chave rotina_personal_v1_ultimo_backup). */
const BKK=K+'_ultimo_backup',BKS=K+'_bk_adiar',BK_DIAS=3;
const ultBk=()=>{try{return localStorage.getItem(BKK)}catch(e){return null}};
function marcaBackup(){try{localStorage.setItem(BKK,new Date().toISOString());localStorage.removeItem(BKS)}catch(e){}} /* zera o contador */
function diasSemBk(){const u=ultBk();if(!u)return 0;const n=Math.floor((Date.now()-new Date(u).getTime())/864e5);return isNaN(n)?0:Math.max(0,n)}
const ultimoTxt=()=>{const u=ultBk();return u?fd(iso(new Date(u)))+' ('+quando(-diasSemBk())+')':'ainda não salvo'};
/* Chamada ao abrir o app e ao voltar para ele: na 1ª vez só registra a data; depois avisa se passaram BK_DIAS dias ou mais. */
function checaBackup(){try{if(!ultBk()){marcaBackup();return}
const n=diasSemBk(),sn=+localStorage.getItem(BKS)||0;if(n<BK_DIAS||Date.now()<sn||$('#ov').style.display=='block')return;
sheet(`<div class="noite"><div class="em">${ico('lock')}</div><p>Aviso do app: já faz ${n} dias que você não salva seus dados!</p><p class="sub" style="font-weight:400">Salve um backup agora para não perder nada se algo acontecer com o celular.</p><button class="btn" onclick="fechar();salvar()">Salvar backup agora</button><button class="btn ghost" onclick="adiaBk()">Lembrar depois</button></div>`)}catch(e){}}
function adiaBk(){try{localStorage.setItem(BKS,String(Date.now()+4*36e5))}catch(e){}fechar()} /* "lembrar depois" = volta a avisar em 4 horas */
/* Valida e limpa um backup antes de restaurar: ids, datas, horas, duplicados e chaves inválidas ficam de fora. */
function sanea(d){const ID=/^[\w-]+$/,DT=/^\d{4}-\d\d-\d\d$/,HR=/^\d\d:\d\d$/,dd=(L,f)=>{const z={};return(Array.isArray(L)?L:[]).filter(x=>x&&typeof x.id=='string'&&ID.test(x.id)&&!z[x.id]&&f(x)&&(z[x.id]=1))};
d.alunos=dd(d.alunos,a=>typeof a.nome=='string');d.alunos.forEach(a=>{a.fixos=(Array.isArray(a.fixos)?a.fixos:[]).filter(f=>f&&f.dia>=0&&f.dia<=6&&HR.test(f.hora));a.valor=+a.valor||0});
d.aulas=dd(d.aulas,x=>DT.test(x.data)&&HR.test(x.hora));d.recebidos=dd(d.recebidos,r=>DT.test(r.data)&&+r.valor>=0);
d.despFixas=dd(d.despFixas,f=>+f.valor>=0&&/^\d{4}-\d\d$/.test(f.ini));d.despLanc=dd(d.despLanc,x=>DT.test(x.data)&&+x.valor>=0);
['feitas','faltas','mov','pagos','despPagas'].forEach(k=>{if(!d[k]||typeof d[k]!='object'||Array.isArray(d[k]))d[k]={}});
Object.keys(d.mov).forEach(k=>{const m=d.mov[k];if(!/^([\w-]+\|\d{4}-\d\d-\d\d\|\d\d:\d\d|a\|[\w-]+)$/.test(k)||!m||!HR.test(m.para)||!HR.test(m.de)||(m.data&&!DT.test(m.data)))delete d.mov[k]});
Object.keys(d.faltas).forEach(k=>{const f=d.faltas[k];if(!f||!DT.test(f.data))delete d.faltas[k]})}

/* =====================================================
   EVOLUÇÃO 5: vários dias de uma vez, duplas (até 2 alunos por horário) e abas Vagos / Dupla
   ===================================================== */
let XD=new Set(),XH='08:00',AG='todos';
/* ✏️ CAPACIDADE: máximo de alunos por horário (2 = dupla). Mude CAP se um dia precisar de outro limite. */
const CAP=2;
/* Todas as aulas do dia; marca "dupla" quando 2 ou mais alunos dividem a mesma hora cheia (cada um com presença/falta própria). */
function aulasDia(d){const R=aulasDia0(d);R.forEach(l=>{l.dupla=!l.falta&&R.filter(x=>!x.falta&&parseInt(x.hora)==parseInt(l.hora)).length>1});return R}
const ativosHora=(d,h)=>aulasDia(d).filter(l=>!l.falta&&parseInt(l.hora)==parseInt(h)); /* quem treina naquela hora */
const vagasFixo=(dia,hora,exc)=>CAP-D.alunos.filter(a=>a.id!=exc&&(a.fixos||[]).some(f=>f.dia==dia&&parseInt(f.hora)==parseInt(hora))).length; /* vagas fixas que sobram */
function porHora(d){const m={};aulasDia(d).forEach(l=>{if(l.falta)return;const h=parseInt(l.hora);(m[h]=m[h]||[]).push(l)});return m}
/* ---------- CADASTRO: marcar vários dias da semana de uma vez ---------- */
function togDia(i){XH=$('#x-h').value||XH;collect();XD.has(i)?XD.delete(i):XD.add(i);drawAluno()}
function addFx(){collect();const h=$('#x-h').value||'08:00',dias=[...XD].sort(),lot=[];XH=h;
if(!dias.length){aviso('Toque em pelo menos um dia da semana.');return}
dias.forEach(d=>{if(E.fixos.some(f=>f.dia==d&&f.hora==h))return;if(vagasFixo(d,h,E.id)<=0){lot.push(DC[d]);return}E.fixos.push({dia:d,hora:h})});
E.fixos.sort((a,b)=>a.dia-b.dia||a.hora.localeCompare(b.hora));XD=new Set();drawAluno();
if(lot.length)aviso('Horário lotado (já tem 2 alunos) em: '+lot.join(', ')+' às '+hh(h)+'. Os outros dias foram adicionados.')}
/* ---------- AGENDA DO DIA: abas Agenda · Vagos (0 alunos) · Dupla (1 aluno, sobra 1 vaga) ---------- */
function agendaLista(){const t=hoje(),agora=sel==t?new Date().getHours():-1,M=porHora(sel),livre=[],dupla=[];
for(let h=H_INI;h<=H_FIM;h++){if(h<=agora)continue;const n=(M[h]||[]).length;if(n==0)livre.push(h);else if(n==1)dupla.push(h)} /* horários lotados (2) não entram em nenhuma aba */
const seg=`<div class="seg s3 mb"><button class="${AG=='todos'?'on':''}" onclick="AG='todos';render()">Agenda</button><button class="${AG=='vagos'?'on':''}" onclick="AG='vagos';render()">Vagos (${livre.length})</button><button class="${AG=='dupla'?'on':''}" onclick="AG='dupla';render()">Dupla (${dupla.length})</button></div>`;
if(AG=='vagos')return seg+(livre.length?livre.map(h=>`<div class="vago" onclick="sheetVago(${h})"><div class="hr">${h}h</div><div class="grow"><b>Vago</b><div class="sub">0 alunos</div></div><span class="mais">＋</span></div>`).join(''):'<div class="card vazio">Nenhum horário totalmente livre neste dia.</div>');
if(AG=='dupla')return seg+(dupla.length?dupla.map(h=>`<div class="card row" onclick="sheetVago(${h})"><div class="hr">${h}h</div><div class="grow"><b>1 vaga sobrando</b><div class="sub">Com ${esc(M[h][0].nome)||'1 aluno'} · cabe mais 1</div></div><span class="mais">＋</span></div>`).join(''):'<div class="card vazio">Nenhum horário com apenas 1 aluno neste dia.</div>');
return seg+slots(sel).map(slotHtml).join('')}
/* Atualiza horas, aviso de lotação e atalhos: horários livres e horários com 1 vaga sobrando (dupla). EXC = a própria aula ao reagendar. */
function liv(){const e=$('#liv'),d=$('#a-d'),sh=$('#a-h');if(!e)return;if(!d||!d.value){e.innerHTML='';return}
sh.innerHTML=horasOpt(d.value,sh.value);
const hv=sh.value,oc=ativosHora(d.value,hv).filter(l=>l.k!=EXC),V=livresAg(d.value),agora=d.value==hoje()?new Date().getHours():-1,M=porHora(d.value),DP=[];
for(let h=H_INI;h<=H_FIM;h++)if(h>agora&&(M[h]||[]).filter(l=>l.k!=EXC).length==1)DP.push(h);
const msg=oc.length>=CAP?`<div class="cft">Horário lotado: já tem 2 alunos às ${hh(hv)} (${oc.map(l=>esc(l.nome)||'sem nome').join(' e ')}). Escolha outro.</div>`:oc.length==1?`<div class="sub" style="margin-top:8px">Já tem 1 aluno às ${hh(hv)} (${esc(oc[0].nome)||'sem nome'}): este fica em dupla com ele.</div>`:'';
const chips=(L,t)=>L.length?`<div class="sub" style="margin:8px 0 6px">${t}</div><div class="chips">${L.map(h=>`<button class="chip sm" onclick="$('#a-h').value='${hora2(h)}';liv()">${h}h</button>`).join('')}</div>`:'';
e.innerHTML=msg+(V.length?chips(V,'Horários livres neste dia:'):'<div class="sub" style="margin-top:8px">Nenhum horário livre neste dia.</div>')+chips(DP,'Com 1 vaga sobrando (dupla):')}

let ult=hoje();
document.addEventListener('visibilitychange',()=>{if(document.hidden)return;if(ult!=hoje()){ult=hoje();limpa();sel=ult;render()}checaBackup()});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
limpa();
render();
checaBackup();
</script></body></html>
